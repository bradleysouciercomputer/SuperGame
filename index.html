<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101116">
  <meta name="description" content="Browse and play original SuperGame browser games.">
  <title>SuperGame — Game Library</title>
  <style>
    :root {
      color-scheme: dark;
      --page: #101116;
      --header: rgba(16, 17, 22, .94);
      --panel: #191b23;
      --panel-hover: #1e202a;
      --text: #f2f3f7;
      --muted: #a1a5b2;
      --quiet: #737987;
      --line: #2b2e39;
      --accent: #a994ff;
      --accent-strong: #bbaaff;
      --content: 1240px;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-synthesis: none;
      text-rendering: optimizeLegibility;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; scroll-padding-top: 88px; }
    body {
      min-width: 320px;
      margin: 0;
      color: var(--text);
      background: var(--page);
      line-height: 1.5;
    }
    a { color: inherit; text-decoration: none; }
    button, input { font: inherit; }
    button { color: inherit; }
    .container { width: min(var(--content), calc(100% - 64px)); margin-inline: auto; }

    .site-header {
      position: sticky;
      z-index: 20;
      top: 0;
      border-bottom: 1px solid var(--line);
      background: var(--header);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
    }
    .nav-wrap {
      display: flex;
      min-height: 68px;
      align-items: center;
      justify-content: space-between;
      gap: 28px;
    }
    .brand { display: inline-flex; align-items: center; gap: 10px; flex-shrink: 0; }
    .brand-mark {
      display: grid;
      width: 36px;
      height: 36px;
      place-items: center;
      border: 1px solid #7764c0;
      border-radius: 10px;
      color: #fff;
      background: #5745a2;
    }
    .brand-name { font-size: 18px; font-weight: 800; letter-spacing: -.65px; }
    .brand-name span { color: var(--accent); }
    .nav-links { display: flex; align-items: center; gap: 27px; }
    .nav-links a {
      color: #b8bbc6;
      font-size: 13px;
      font-weight: 600;
      transition: color .16s ease;
    }
    .nav-links a:hover, .nav-links a[aria-current="page"] { color: #fff; }
    .nav-github {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      min-height: 35px;
      padding: 0 11px;
      border: 1px solid var(--line);
      border-radius: 8px;
      color: #c9cbd4;
      font-size: 12px;
      font-weight: 650;
      transition: border-color .16s ease, background .16s ease;
    }
    .nav-github:hover { border-color: #555966; background: #1d2029; }

    main { min-height: calc(100vh - 160px); }
    .library-page { padding: 52px 0 84px; }
    .page-heading {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 24px;
      margin-bottom: 34px;
    }
    .breadcrumb {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 13px;
      color: var(--quiet);
      font-size: 10px;
      font-weight: 750;
      letter-spacing: 1.2px;
      text-transform: uppercase;
    }
    .breadcrumb span:last-child { color: #b8a8ff; }
    .breadcrumb-separator { color: #555b68; }
    h1 {
      margin: 0;
      font-size: clamp(32px, 4vw, 40px);
      font-weight: 760;
      line-height: 1.1;
      letter-spacing: -1.7px;
    }
    .page-description {
      max-width: 470px;
      margin: 10px 0 0;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.65;
    }
    .library-total {
      flex: 0 0 auto;
      padding-bottom: 4px;
      color: #9297a5;
      font-size: 12px;
      font-weight: 600;
      white-space: nowrap;
    }
    .library-total strong { color: #e0e1e7; font-weight: 700; }

    .library-toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      margin-bottom: 23px;
      padding-bottom: 17px;
      border-bottom: 1px solid var(--line);
    }
    .filter-list { display: flex; align-items: center; gap: 7px; flex-wrap: wrap; }
    .filter-button {
      min-height: 35px;
      padding: 0 13px;
      border: 1px solid transparent;
      border-radius: 8px;
      color: #aeb2bf;
      background: transparent;
      cursor: pointer;
      font-size: 12px;
      font-weight: 650;
      transition: background .16s ease, border-color .16s ease, color .16s ease;
    }
    .filter-button:hover { color: #f1f1f6; background: #1b1d25; }
    .filter-button[aria-pressed="true"] {
      border-color: #4a416e;
      color: #e5deff;
      background: #29243d;
    }
    .search-box {
      display: flex;
      width: min(100%, 250px);
      min-width: 190px;
      height: 38px;
      align-items: center;
      gap: 9px;
      padding: 0 11px;
      border: 1px solid var(--line);
      border-radius: 8px;
      color: #858b99;
      background: #171920;
      transition: border-color .16s ease, background .16s ease;
    }
    .search-box:focus-within { border-color: #7262b0; background: #1a1b24; }
    .search-box input {
      width: 100%;
      min-width: 0;
      padding: 0;
      border: 0;
      outline: 0;
      color: var(--text);
      background: transparent;
      font-size: 12px;
    }
    .search-box input::placeholder { color: #777d8b; opacity: 1; }
    .search-shortcut {
      flex: 0 0 auto;
      padding: 2px 5px;
      border: 1px solid #373a45;
      border-radius: 4px;
      color: #777d8b;
      font-size: 10px;
      line-height: 1.2;
    }

    .game-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 22px; }
    .game-card {
      min-width: 0;
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: var(--panel);
      transition: transform .18s ease, border-color .18s ease, background .18s ease;
    }
    .game-card:hover, .game-card:focus-visible {
      transform: translateY(-3px);
      border-color: #5a507b;
      background: var(--panel-hover);
    }
    .game-card:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
    .game-card-art {
      position: relative;
      display: block;
      aspect-ratio: 16 / 10;
      overflow: hidden;
      background: #202536;
      isolation: isolate;
    }
    .game-card-image {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
      transition: transform .42s cubic-bezier(.2,.7,.2,1), filter .25s ease;
    }
    .game-card:hover .game-card-image { transform: scale(1.035); filter: saturate(1.05); }
    .game-card-fallback {
      position: absolute;
      inset: 0;
      display: none;
      place-items: center;
      color: rgba(255,255,255,.9);
      background: radial-gradient(circle at 50% 42%, rgba(166,145,255,.25), transparent 40%), #202536;
      font-size: 46px;
      font-weight: 800;
      letter-spacing: -3px;
    }
    .game-card-art.is-fallback .game-card-fallback { display: grid; }
    .game-card-body { padding: 16px 17px 17px; }
    .game-card-meta {
      display: flex;
      min-height: 17px;
      align-items: center;
      gap: 8px;
      margin-bottom: 8px;
      color: #aaa0dc;
      font-size: 10px;
      font-weight: 750;
      letter-spacing: .65px;
      text-transform: uppercase;
    }
    .meta-dot { width: 3px; height: 3px; border-radius: 50%; background: #6d7180; }
    .game-card h2 {
      margin: 0;
      color: #f1f2f6;
      font-size: 18px;
      font-weight: 720;
      letter-spacing: -.45px;
      line-height: 1.3;
    }
    .game-card-description {
      min-height: 38px;
      margin: 7px 0 15px;
      color: #a0a4b0;
      font-size: 12px;
      line-height: 1.6;
    }
    .game-card-bottom {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding-top: 12px;
      border-top: 1px solid #2a2d37;
    }
    .game-card-type { color: #7f8593; font-size: 11px; font-weight: 600; }
    .game-card-play {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      color: #d2c8ff;
      font-size: 11px;
      font-weight: 750;
      transition: color .16s ease, gap .16s ease;
    }
    .game-card:hover .game-card-play { gap: 10px; color: #fff; }
    .game-card-play svg { width: 13px; height: 13px; }

    .empty-results {
      grid-column: 1 / -1;
      padding: 65px 20px;
      border: 1px dashed #343744;
      border-radius: 12px;
      color: var(--muted);
      text-align: center;
      background: #15171e;
    }
    .empty-results h2 { margin: 0 0 7px; color: #e7e8ee; font-size: 17px; }
    .empty-results p { margin: 0; font-size: 12px; }

    .site-footer { border-top: 1px solid var(--line); background: #0d0e13; }
    .footer-inner {
      display: flex;
      min-height: 82px;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
    }
    .footer-note { color: #838896; font-size: 11px; }
    .footer-links { display: flex; align-items: center; gap: 20px; }
    .footer-links a { color: #999eab; font-size: 11px; font-weight: 600; }
    .footer-links a:hover { color: #fff; }

    @media (max-width: 900px) {
      .game-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 17px; }
      .page-heading { align-items: flex-start; flex-direction: column; gap: 12px; }
      .library-total { padding: 0; }
    }
    @media (max-width: 640px) {
      .container { width: min(var(--content), calc(100% - 34px)); }
      .nav-wrap { min-height: 62px; gap: 14px; }
      .brand-mark { width: 34px; height: 34px; }
      .brand-name { font-size: 17px; }
      .nav-links { gap: 16px; }
      .nav-links a { font-size: 12px; }
      .nav-github { width: 34px; height: 34px; min-height: 34px; justify-content: center; padding: 0; font-size: 0; }
      .nav-github svg { width: 16px; height: 16px; }
      .library-page { padding: 36px 0 58px; }
      .page-heading { margin-bottom: 25px; }
      h1 { font-size: 33px; }
      .page-description { font-size: 13px; }
      .library-toolbar { align-items: stretch; flex-direction: column-reverse; gap: 13px; margin-bottom: 18px; }
      .filter-list { flex-wrap: nowrap; overflow-x: auto; padding-bottom: 3px; scrollbar-width: none; }
      .filter-list::-webkit-scrollbar { display: none; }
      .filter-button { flex: 0 0 auto; }
      .search-box { width: 100%; }
      .game-grid { grid-template-columns: 1fr; gap: 15px; }
      .game-card { display: grid; grid-template-columns: minmax(0, 42%) minmax(0, 1fr); align-items: stretch; }
      .game-card-art { height: 100%; min-height: 150px; aspect-ratio: auto; }
      .game-card-body { display: flex; min-width: 0; flex-direction: column; justify-content: center; padding: 13px 14px; }
      .game-card-meta { margin-bottom: 5px; font-size: 9px; }
      .game-card h2 { font-size: 15px; }
      .game-card-description { min-height: 0; margin: 5px 0 10px; font-size: 11px; }
      .game-card-bottom { width: 100%; margin-top: auto; padding-top: 9px; }
      .game-card-type { font-size: 10px; }
      .game-card-play { font-size: 10px; }
      .footer-inner { min-height: 74px; align-items: flex-start; flex-direction: column; justify-content: center; gap: 9px; padding-block: 17px; }
      .footer-links { gap: 16px; }
    }
    @media (max-width: 390px) {
      .game-card { grid-template-columns: minmax(0, 39%) minmax(0, 1fr); }
      .game-card-art { min-height: 140px; }
      .game-card-body { padding: 11px; }
      .game-card-type { max-width: 90px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; transition-duration: .01ms !important; }
    }
  </style>
</head>
<body>
  <header class="site-header">
    <div class="container nav-wrap">
      <a class="brand" href="./" aria-label="SuperGame home">
        <span class="brand-mark" aria-hidden="true">
          <svg width="21" height="21" viewBox="0 0 24 24" fill="none">
            <path d="M7.2 8.2h9.6a4.1 4.1 0 0 1 3.9 5.3l-.7 2.3a2.2 2.2 0 0 1-3.6 1l-2-1.7H9.6l-2 1.7a2.2 2.2 0 0 1-3.6-1l-.7-2.3a4.1 4.1 0 0 1 3.9-5.3Z" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/>
            <path d="M8 10.4v4M6 12.4h4M16.3 11.1h.01M18.1 13h.01" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
          </svg>
        </span>
        <span class="brand-name">Super<span>Game</span></span>
      </a>
      <nav class="nav-links" aria-label="Main navigation">
        <a href="#games" aria-current="page">Games</a>
        <a href="#about">About</a>
      </nav>
      <a class="nav-github" href="https://github.com/bradleysouciercomputer/SuperGame" target="_blank" rel="noopener noreferrer" aria-label="SuperGame on GitHub">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 .9a11.1 11.1 0 0 0-3.51 21.63c.56.1.76-.24.76-.54v-2.08c-3.1.68-3.76-1.32-3.76-1.32-.5-1.3-1.24-1.65-1.24-1.65-1.01-.69.08-.68.08-.68 1.12.08 1.71 1.15 1.71 1.15 1 1.7 2.62 1.21 3.26.93.1-.72.39-1.21.71-1.49-2.48-.28-5.09-1.24-5.09-5.52 0-1.22.44-2.22 1.15-3-.12-.28-.5-1.42.11-2.96 0 0 .94-.3 3.05 1.15a10.6 10.6 0 0 1 5.55 0c2.11-1.45 3.05-1.15 3.05-1.15.61 1.54.23 2.68.11 2.96.72.78 1.15 1.78 1.15 3 0 4.29-2.61 5.23-5.1 5.51.4.35.75 1.03.75 2.08v3.08c0 .3.2.65.77.54A11.1 11.1 0 0 0 12 .9Z"/></svg>
        GitHub
      </a>
    </div>
  </header>

  <main id="games">
    <section class="library-page">
      <div class="container">
        <div class="page-heading">
          <div>
            <div class="breadcrumb"><span>SuperGame</span><span class="breadcrumb-separator">/</span><span>Game library</span></div>
            <h1>Game library</h1>
            <p class="page-description">Pick a game, jump in, and play right in your browser.</p>
          </div>
          <div class="library-total" id="gameCount" aria-live="polite">3 games</div>
        </div>

        <div class="library-toolbar">
          <div class="filter-list" role="group" aria-label="Filter games by category">
            <button class="filter-button" type="button" data-filter="all" aria-pressed="true">All games</button>
            <button class="filter-button" type="button" data-filter="runner" aria-pressed="false">Runners</button>
            <button class="filter-button" type="button" data-filter="shooter" aria-pressed="false">Shooters</button>
            <button class="filter-button" type="button" data-filter="3d" aria-pressed="false">3D games</button>
          </div>
          <label class="search-box">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="10.8" cy="10.8" r="6.8" stroke="currentColor" stroke-width="1.8"/><path d="m16 16 4.5 4.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
            <input id="gameSearch" type="search" placeholder="Search games" autocomplete="off" aria-label="Search games">
            <span class="search-shortcut" aria-hidden="true">/</span>
          </label>
        </div>

        <div id="gameLibrary" class="game-grid" aria-live="polite">
          <div class="empty-results"><h2>Loading games…</h2><p>Your library will appear here.</p></div>
        </div>
      </div>
    </section>
  </main>

  <footer class="site-footer" id="about">
    <div class="container footer-inner">
      <div class="footer-note">SuperGame — original browser games, made to play.</div>
      <div class="footer-links">
        <a href="#games">Game library</a>
        <a href="https://github.com/bradleysouciercomputer/SuperGame" target="_blank" rel="noopener noreferrer">GitHub ↗</a>
      </div>
    </div>
  </footer>

  <script>
    // Add each new game here when it is ready to publish.
    const games = [
      {
        title: "Neon Dash",
        description: "Jump, dodge, and chase your high score.",
        url: "games/neon-dash/",
        category: "Endless Runner",
        filter: "runner",
        format: "2D",
        thumbnail: "games/neon-dash/thumbnail.svg",
        color: "#332b7a"
      },
      {
        title: "Starfall",
        description: "Blast through waves and defend the outpost.",
        url: "games/starfall/",
        category: "Space Shooter",
        filter: "shooter",
        format: "2D",
        thumbnail: "games/starfall/thumbnail.svg",
        color: "#124f83"
      },
      {
        title: "Neon Tracks 3D",
        description: "Run the futuristic metro in SuperGame's first 3D game.",
        url: "games/neon-tracks-3d/",
        category: "Endless Runner",
        filter: "3d",
        format: "3D",
        thumbnail: "games/neon-tracks-3d/thumbnail.svg",
        color: "#332b7a"
      }
    ];

    const library = document.getElementById("gameLibrary");
    const gameCount = document.getElementById("gameCount");
    const searchInput = document.getElementById("gameSearch");
    const filterButtons = Array.from(document.querySelectorAll(".filter-button"));
    let activeFilter = "all";

    function createGameCard(game) {
      const link = document.createElement("a");
      link.className = "game-card";
      link.href = game.url;
      link.setAttribute("aria-label", "Play " + game.title);

      const art = document.createElement("div");
      art.className = "game-card-art";
      art.style.backgroundColor = game.color || "#202536";

      const fallback = document.createElement("div");
      fallback.className = "game-card-fallback";
      fallback.textContent = game.title.slice(0, 1).toUpperCase();
      art.appendChild(fallback);

      if (game.thumbnail) {
        const image = document.createElement("img");
        image.className = "game-card-image";
        image.src = game.thumbnail;
        image.alt = game.title + " game artwork";
        image.loading = "lazy";
        image.decoding = "async";
        image.addEventListener("error", function () {
          art.classList.add("is-fallback");
          image.remove();
        }, { once: true });
        art.appendChild(image);
      } else {
        art.classList.add("is-fallback");
      }

      const body = document.createElement("div");
      body.className = "game-card-body";

      const meta = document.createElement("div");
      meta.className = "game-card-meta";
      const category = document.createElement("span");
      category.textContent = game.category || "Arcade";
      const dot = document.createElement("span");
      dot.className = "meta-dot";
      dot.setAttribute("aria-hidden", "true");
      const format = document.createElement("span");
      format.textContent = game.format || "Game";
      meta.append(category, dot, format);

      const title = document.createElement("h2");
      title.textContent = game.title;

      const description = document.createElement("p");
      description.className = "game-card-description";
      description.textContent = game.description || "Play now.";

      const bottom = document.createElement("div");
      bottom.className = "game-card-bottom";

      const type = document.createElement("span");
      type.className = "game-card-type";
      type.textContent = game.filter === "shooter" ? "Arcade action" : "Single player";

      const play = document.createElement("span");
      play.className = "game-card-play";
      play.innerHTML = 'Play game <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M5 12h14m-6-6 6 6-6 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>';

      bottom.append(type, play);
      body.append(meta, title, description, bottom);
      link.append(art, body);
      return link;
    }

    function renderGames() {
      const query = searchInput.value.trim().toLowerCase();
      const visibleGames = games.filter(function (game) {
        const matchesFilter = activeFilter === "all" || game.filter === activeFilter;
        const searchable = [game.title, game.description, game.category, game.format].join(" ").toLowerCase();
        return matchesFilter && searchable.includes(query);
      });

      gameCount.textContent = visibleGames.length + (visibleGames.length === 1 ? " game" : " games");
      library.replaceChildren();

      if (visibleGames.length === 0) {
        const empty = document.createElement("div");
        empty.className = "empty-results";
        const title = document.createElement("h2");
        title.textContent = "No games found";
        const detail = document.createElement("p");
        detail.textContent = "Try a different search or category.";
        empty.append(title, detail);
        library.appendChild(empty);
        return;
      }

      visibleGames.forEach(function (game) {
        library.appendChild(createGameCard(game));
      });
    }

    filterButtons.forEach(function (button) {
      button.addEventListener("click", function () {
        activeFilter = button.dataset.filter;
        filterButtons.forEach(function (item) {
          item.setAttribute("aria-pressed", String(item === button));
        });
        renderGames();
      });
    });

    searchInput.addEventListener("input", renderGames);
    document.addEventListener("keydown", function (event) {
      if (event.key === "/" && !event.ctrlKey && !event.metaKey && !event.altKey) {
        const active = document.activeElement;
        const isTyping = active && (active.tagName === "INPUT" || active.tagName === "TEXTAREA" || active.isContentEditable);
        if (!isTyping) {
          event.preventDefault();
          searchInput.focus();
        }
      }
      if (event.key === "Escape" && document.activeElement === searchInput) {
        searchInput.value = "";
        renderGames();
        searchInput.blur();
      }
    });

    renderGames();
  </script>
</body>
</html>
