<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="800" viewBox="0 0 1280 800" role="img" aria-labelledby="title desc">
<title id="title">Neon Dash game artwork</title><desc id="desc">A glowing arcade runner leaps across a platform above a futuristic sunset city.</desc>
<defs>
