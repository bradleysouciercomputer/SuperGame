<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="800" viewBox="0 0 1280 800" role="img" aria-labelledby="title desc">
<title id="title">Neon Tracks 3D game artwork</title><desc id="desc">A stylized three-dimensional runner sprints down a futuristic subway with neon rails and an approaching metro train.</desc>
<defs>
 <linearGradient id="sky" x2="0" y2="1"><stop stop-color="#101832"/><stop offset=".52" stop-color="#262653"/><stop offset="1" stop-color="#101a32"/></linearGradient>
 <linearGradient id="floor" x2="0" y2="1"><stop stop-color="#273752"/><stop offset="1" stop-color="#0d172a"/></linearGradient>
 <linearGradient id="train" x2="0" y2="1"><stop stop-color="#6c91b1"/><stop offset=".23" stop-color="#294865"/><stop offset="1" stop-color="#132840"/></linearGradient>
 <linearGradient id="glass" x2="1" y2="1"><stop stop-color="#a5f5ff"/><stop offset=".45" stop-color="#4786ba"/><stop offset="1" stop-color="#172f5d"/></linearGradient>
 <linearGradient id="jacket" x2="1" y2="1"><stop stop-color="#c1a5ff"/><stop offset=".52" stop-color="#6c62b8"/><stop offset="1" stop-color="#293e73"/></linearGradient>
 <linearGradient id="rail" x2="0" y2="1"><stop stop-color="#bcffff"/><stop offset=".4" stop-color="#61e5dd"/><stop offset="1" stop-color="#277d98"/></linearGradient>
 <radialGradient id="haze"><stop stop-color="#5d55a8" stop-opacity=".52"/><stop offset="1" stop-color="#151d3d" stop-opacity="0"/></radialGradient>
 <filter id="glow"><feGaussianBlur stdDeviation="17"/></filter>
</defs>
<rect width="1280" height="800" fill="url(#sky)"/><ellipse cx="640" cy="365" rx="590" ry="340" fill="url(#haze)"/>
<g opacity=".65" stroke="#6e83ba" fill="none"><path d="M0 80 640 290 1280 80M0 170 640 310 1280 170M0 260 640 330 1280 260" stroke-width="3"/></g>
<!-- station arches: strong perspective -->
<path d="M-60 0h1400v110H-60Z" fill="#151f3c"/>
<path d="M-50 110 0 30h1280l50 80" fill="none" stroke="#8b76cc" stroke-width="14" opacity=".55"/>
<path d="M0 0 278 298M1280 0 1002 298" stroke="#43547c" stroke-width="25" opacity=".7"/>
<path d="M75 0 312 290M1205 0 968 290" stroke="#75dbdf" stroke-width="8" opacity=".75" filter="url(#glow)"/>
<g fill="#1b2845" stroke="#41577d" stroke-width="8">
 <path d="M0 0h110v800H0zM1170 0h110v800h-110z"/>
 <path d="M0 0 120 0 420 550 0 800ZM1280 0h-120L860 550l420 250Z" opacity=".75"/>
</g>
<!-- luminous station signs -->
<g transform="translate(60 145)"><rect width="270" height="84" rx="10" fill="#111d38" stroke="#71e5df" stroke-width="4"/><rect x="12" y="12" width="246" height="60" rx="5" fill="#1a3150"/><text x="28" y="50" font-family="Arial,sans-serif" font-size="28" font-weight="900" fill="#d9ffff" letter-spacing="4">NEON METRO</text></g>
<g transform="translate(965 170)"><rect width="248" height="70" rx="9" fill="#111d38" stroke="#a98bff" stroke-width="4"/><text x="22" y="43" font-family="Arial,sans-serif" font-size="23" font-weight="900" fill="#e9dfff" letter-spacing="3">LINE 03  →</text></g>
<!-- city advertisements along walls -->
<g opacity=".9"><rect x="16" y="350" width="145" height="160" rx="9" fill="#182b49" stroke="#69dadc" stroke-width="4"/><path d="M40 390h96M40 414h62M40 438h80" stroke="#a3f8ed" stroke-width="8"/><rect x="1115" y="390" width="148" height="150" rx="9" fill="#1b294b" stroke="#a28aff" stroke-width="4"/><circle cx="1188" cy="448" r="31" fill="#a58aff" opacity=".65"/><path d="M1150 500h75" stroke="#c8b9ff" stroke-width="8"/></g>
<!-- oncoming metro train on right track -->
<g transform="translate(920 325)">
 <path d="M-156 0q0-60 50-90h212q50 30 50 90v300h-312Z" fill="url(#train)" stroke="#9bdfff" stroke-width="8"/>
 <path d="M-100-72h200q31 22 39 61h-278q8-39 39-61Z" fill="url(#glass)" stroke="#c0faff" stroke-width="7"/>
 <path d="M-2-70v57" stroke="#c2ffff" stroke-width="7"/>
 <path d="M-140 18h280v18h-280Z" fill="#68e4e0"/><path d="M-135 60h270v22h-270Z" fill="#172e4b"/>
 <g fill="#9cfaff"><rect x="-120" y="104" width="88" height="65" rx="5"/><rect x="32" y="104" width="88" height="65" rx="5"/></g>
 <g fill="#e5f5ff"><rect x="-116" y="108" width="80" height="57" rx="3"/><rect x="36" y="108" width="80" height="57" rx="3"/></g>
 <g fill="#ffcf87"><rect x="-131" y="245" width="44" height="18" rx="8"/><rect x="87" y="245" width="44" height="18" rx="8"/></g>
