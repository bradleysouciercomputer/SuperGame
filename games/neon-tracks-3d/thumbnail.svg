</g>
<path d="M0 780 540 370M1280 780 740 370" stroke="#5be2dc" stroke-width="25" opacity=".2" filter="url(#glow)"/>
<!-- collectible orbs -->
<g fill="#ffdf83" stroke="#fff6cf" stroke-width="4"><circle cx="450" cy="530" r="17"/><circle cx="416" cy="575" r="13"/><circle cx="375" cy="625" r="10"/></g>
<g fill="#fff"><circle cx="450" cy="530" r="5"/><circle cx="416" cy="575" r="4"/><circle cx="375" cy="625" r="3"/></g>
