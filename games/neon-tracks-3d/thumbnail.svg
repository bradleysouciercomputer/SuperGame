</g>
<!-- converging three track lanes and polished rails -->
<path d="M0 800 540 372 740 372 1280 800Z" fill="url(#floor)"/>
<path d="M0 800 552 390 570 390 235 800Z" fill="#263b55" opacity=".8"/>
<path d="M1045 800 710 390 728 390 1280 800Z" fill="#263b55" opacity=".8"/>
<g stroke="url(#rail)" fill="none" stroke-linecap="round">
 <path d="M145 800 562 390M380 800 600 390M900 800 680 390M1135 800 718 390" stroke-width="13"/>
 <path d="M145 800 562 390M380 800 600 390M900 800 680 390M1135 800 718 390" stroke="#ddffff" stroke-width="3" opacity=".7"/>
</g>
<g stroke="#8ca2bc" stroke-width="9" opacity=".7">
