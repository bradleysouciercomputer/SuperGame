 <path d="M-41-7q42-24 82 0l28 84q-66 42-138 0Z" fill="url(#jacket)" stroke="#d7c8ff" stroke-width="7"/>
 <path d="M-37 0q36 20 74 0l14 66q-52 30-103 0Z" fill="#273c70"/>
 <path d="M-43 22h88M-37 40h76" stroke="#9c8de1" stroke-width="7"/>
 <rect x="-27" y="2" width="54" height="72" rx="12" fill="#172c49" stroke="#b4a6ff" stroke-width="5"/>
 <rect x="-18" y="19" width="36" height="12" rx="5" fill="#68e8df"/>
 <path d="M-40-21q1-48 40-53 40 5 40 53l-10 32q-31 17-60 0Z" fill="#1b2a47" stroke="#a995ff" stroke-width="7"/>
 <path d="M-30-24q30-24 60 0" stroke="#75e8e0" stroke-width="6" fill="none"/>
 <path d="M-25-75q25-30 50 0" stroke="#d9c8ff" stroke-width="5" fill="none"/>
 <path d="M-6-80h12" stroke="#fff" stroke-width="4"/>
 <path d="M-38 15h-18l-12 18 22 16 17-18ZM38 15h18l12 18-22 16-17-18Z" fill="#5e548f" stroke="#c0b2ff" stroke-width="5"/>
 <path d="M-57 45-68 65l21 11 17-24M57 45 68 65 47 76 30 52" fill="#b3a2f8"/>
 <path d="M-23 80h46" stroke="#68e8df" stroke-width="8"/>
</g>
<g transform="translate(64 55)"><rect width="300" height="42" rx="21" fill="#10172d" fill-opacity=".6" stroke="#b9d8fa" stroke-opacity=".3"/><circle cx="23" cy="21" r="6" fill="#8ceaca"/><text x="42" y="27" fill="#edf6ff" font-family="Arial,sans-serif" font-size="17" font-weight="700" letter-spacing="3">NEON TRACKS 3D</text></g>
</svg>