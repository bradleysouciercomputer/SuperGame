<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="800" viewBox="0 0 1280 800" role="img" aria-labelledby="title desc">
<title id="title">Starfall game artwork</title><desc id="desc">A sleek starfighter fires glowing energy beams at enemy ships in a colorful deep-space battle.</desc>
<defs>
 <linearGradient id="space" x2="0" y2="1"><stop stop-color="#080d24"/><stop offset=".55" stop-color="#111d43"/><stop offset="1" stop-color="#161638"/></linearGradient>
 <radialGradient id="nebula"><stop stop-color="#8a55c9" stop-opacity=".62"/><stop offset=".55" stop-color="#3155a0" stop-opacity=".32"/><stop offset="1" stop-color="#18204a" stop-opacity="0"/></radialGradient>
 <linearGradient id="ship" x2="1" y2="1"><stop stop-color="#e4faff"/><stop offset=".38" stop-color="#73c8ef"/><stop offset="1" stop-color="#354b9b"/></linearGradient>
 <linearGradient id="enemy" x2="0" y2="1"><stop stop-color="#ffc47c"/><stop offset=".55" stop-color="#ed729d"/><stop offset="1" stop-color="#814d9e"/></linearGradient>
 <linearGradient id="beam" x2="0" y2="1"><stop stop-color="#c7ffff"/><stop offset=".25" stop-color="#6bf2ec"/><stop offset="1" stop-color="#65bcff" stop-opacity="0"/></linearGradient>
 <filter id="glow"><feGaussianBlur stdDeviation="13"/></filter><filter id="blur"><feGaussianBlur stdDeviation="30"/></filter>
 <pattern id="grid" width="80" height="80" patternUnits="userSpaceOnUse"><path d="M80 0H0V80" fill="none" stroke="#80b8ff" stroke-opacity=".08"/></pattern>
</defs>
<rect width="1280" height="800" fill="url(#space)"/><rect width="1280" height="800" fill="url(#grid)"/>
